<!-- @dsCard group="Colors" viewport="700x150" subtitle="Danger, warning, success, info + containers" name="Status" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--kys-bg);font-family:var(--kys-font-sans);color:var(--kys-text)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:12px;background:var(--kys-red-500)"></div><div style="height:36px;border-radius:12px;background:var(--kys-red-50);color:var(--kys-red-700);display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:500">Danger</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:12px;background:var(--kys-amber-500)"></div><div style="height:36px;border-radius:12px;background:var(--kys-amber-50);color:var(--kys-amber-700);display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:500">Warning</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:12px;background:var(--kys-green-500)"></div><div style="height:36px;border-radius:12px;background:var(--kys-green-50);color:var(--kys-green-700);display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:500">Success</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:12px;background:var(--kys-blue-500)"></div><div style="height:36px;border-radius:12px;background:var(--kys-blue-50);color:var(--kys-blue-700);display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:500">Info</div></div></div></body></html>
