<!-- @dsCard group="Colors" viewport="700x170" subtitle="bg → surface → muted; text tiers" name="Semantic surfaces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--kys-bg);font-family:var(--kys-font-sans);color:var(--kys-text)}</style></head><body><div style="background:var(--kys-bg);border:1px solid var(--kys-border);border-radius:20px;padding:14px;display:flex;gap:12px"><div style="flex:1;background:var(--kys-surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px"><div style="font:600 15px var(--kys-font-sans)">--kys-text</div><div style="font-size:14px;color:var(--kys-text-muted)">--kys-text-muted</div><div style="font-size:13px;color:var(--kys-text-subtle)">--kys-text-subtle</div></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="background:var(--kys-surface-muted);border-radius:999px;height:36px;display:flex;align-items:center;padding:0 14px;font-size:13px">--kys-surface-muted</div><div style="background:var(--kys-state-selected);border-radius:16px;height:36px;display:flex;align-items:center;padding:0 14px;font-size:13px">--kys-state-selected</div><div style="background:var(--kys-primary);color:#fff;border-radius:999px;height:36px;display:flex;align-items:center;padding:0 14px;font-size:13px;font-weight:600">--kys-primary</div></div></div></body></html>
